name: Build Genesis Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    needs: database-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          url=os.environ.get('SUPABASE_URL','')
          key=os.environ.get('SUPABASE_PUBLISHABLE_KEY','')
          assert url.startswith('https://') and url==url.strip(), 'Set repository variable SUPABASE_URL to your HTTPS project URL (no surrounding spaces).'
          assert key and key==key.strip(), 'Set repository variable SUPABASE_PUBLISHABLE_KEY; check its spelling.'
          assert not key.startswith('sb_secret_'), 'Use the public publishable key, never a secret key.'
          print('Required public configuration is present.')
          PY
      - name: Prepare shared deterministic character engine
        run: |
          npm install --prefix tools --no-audit --no-fund
          node tools/transpile.cjs
          node tools/validate-standard.cjs
          node tests/engine-v2.cjs
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify engine, build APK, and run Android lint
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Genesis-Test-Reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply original migrations in a disposable test database
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/native-auth-fixture.sql
          psql -v ON_ERROR_STOP=1 -f backend/supabase-schema.sql -f backend/supabase-v16_1-migration.sql -f backend/supabase-v16_3a-migration.sql -f backend/supabase-v16_3b-migration.sql -f backend/supabase-v16_3c-migration.sql -f backend/supabase-v16_3c_1-hotfix.sql -f backend/supabase-v16_3d-migration.sql -f backend/supabase-v16_4-migration.sql -f backend/supabase-native-bootstrap-guard.sql
          psql -v ON_ERROR_STOP=1 -f tests/native-backend.sql
          psql -v ON_ERROR_STOP=1 -f backend/supabase-v17-migration.sql
          psql -v ON_ERROR_STOP=1 -f backend/supabase-v17-migration.sql
          psql -v ON_ERROR_STOP=1 -f tests/v2-backend.sql
