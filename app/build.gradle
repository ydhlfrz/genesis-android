plugins { id 'com.android.application' }
def config = new Properties()
def configFile = rootProject.file('genesis.properties')
if (configFile.exists()) configFile.withInputStream { config.load(it) }
def literal = { String s -> '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'com.genesis.gacha'
    compileSdk 35
    defaultConfig {
        applicationId 'com.genesis.gacha'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '17.0.0-native'
        buildConfigField 'String', 'SUPABASE_URL', literal(System.getenv('SUPABASE_URL') ?: config.getProperty('SUPABASE_URL', ''))
        buildConfigField 'String', 'SUPABASE_KEY', literal(System.getenv('SUPABASE_PUBLISHABLE_KEY') ?: config.getProperty('SUPABASE_PUBLISHABLE_KEY', ''))
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "org.mozilla:rhino:1.7.15"; testImplementation "junit:junit:4.13.2"; testImplementation "org.json:json:20240303" }
